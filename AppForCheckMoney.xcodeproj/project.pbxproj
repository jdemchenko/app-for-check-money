ct \"$WATCH\" 2>/dev/null; then\n  echo \"warning: embedded Watch companion codesign --verify failed (CodeSignOnCopy may still be OK for device)\"\n  /usr/bin/codesign --verify --deep --strict \"$WATCH\" || true\nfi\n# Fail closed if entitlements were stripped (no application-identifier). Do NOT codesign --force to fix this.\nAPPID=$(/usr/bin/codesign -d --entitlements :- \"$WATCH\" 2>/dev/null | plutil -extract application-identifier raw -o - - 2>/dev/null || true)\nif [ -z \"$APPID\" ]; then\n  echo \"error: embedded Watch companion has empty entitlements (no application-identifier)\"\n  echo \"error: Available Apps stays empty / Watch-only installs get purged\"\n  /usr/bin/codesign -d --entitlements :- \"$WATCH\" 2>/dev/null | plutil -p - || true\n  exit 1\nfi\nTEAM=$(/usr/bin/codesign -dvv \"$WATCH\" 2>&1 | sed -n 's/^TeamIdentifier=//p' | head -1)\nFMT=$(/usr/bin/codesign -dvv \"$WATCH\" 2>&1 | sed -n 's/^Format=//p' | head -1)\necho \"note: Watch companion OK → $WATCH\"\necho \"note: companion of $COMPANION · independent=$INDEP · UIDeviceFamily=$FAMILY · Team=$TEAM · app-id=$APPID · Format=$FMT\"\necho \"note: Available Apps only — delete any Watch-only install first, then iPhone Run\"\n/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' \"$PLIST\" 2>/dev/null || true\n/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \"$PLIST\" 2>/dev/null || true\n";
